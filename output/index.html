<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather Dashboard · Guided Coding</title>
<meta name="description" content="Search any city: current weather, 24-hour chart, 7-day outlook and a live contour map of the terrain. Built at the Guided Coding workshop." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0d'/%3E%3Cpath d='M4 22c6-8 10 2 16-6s8 2 8 2' fill='none' stroke='%23c8102e' stroke-width='3'/%3E%3C/svg%3E" />
<!-- Static showcase build: no backend. The browser calls Open-Meteo and the terrain tiles directly. -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-contour@4.0.2/dist/d3-contour.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --field:#0a0a0d; --panel:#111217; --ink:#f2f3f6; --soft:#c4c6ce; --muted:#7d808b;
    --rule:#2c2e35; --accent:#c8102e; --cool:#7fb2ff;
    --display:"Anton",Impact,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
    --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--field);color:var(--ink);font-family:var(--sans);min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 48px}
  .readout{display:flex;justify-content:space-between;gap:16px;font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--rule)}
  .readout b{color:var(--accent);font-weight:500}
  .mono{font-family:var(--mono)}
  .k{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}

  form{display:flex;gap:10px;margin:28px 0 14px}
  input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--rule);color:var(--ink);font:400 18px var(--sans);padding:14px 16px;outline:none}
  input:focus{border-color:var(--accent)}
  button.go{background:var(--accent);color:#fff;border:0;font:700 13px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:0 22px;cursor:pointer}
  button.go:disabled{opacity:.6;cursor:wait}
  .chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{background:none;border:1px solid var(--rule);color:var(--soft);font:400 12px var(--mono);letter-spacing:.06em;padding:6px 10px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .units{margin-left:auto;display:flex;border:1px solid var(--rule)}
  .units button{background:none;border:0;color:var(--muted);font:500 12px var(--mono);padding:6px 10px;cursor:pointer}
  .units button.on{background:var(--ink);color:var(--field)}

  .error{margin-top:28px;border-left:3px solid var(--accent);padding:14px 18px;background:var(--panel);font:400 15px var(--mono);color:var(--soft)}
  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:36px;margin-top:34px;align-items:end;position:relative}
  .hero > div:not(.terrain):not(.terrain-cap){position:relative;z-index:1}
  form,.chips{position:relative;z-index:2}   /* keep the search bar above the terrain's faded top edge */
  /* terrain: real contour lines of the searched place, behind the stats panel */
  .terrain{position:absolute;z-index:0;pointer-events:none;top:-150px;bottom:-40px;right:-24px;width:64%;
    opacity:0;transition:opacity 1.2s ease;
    -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 30%,rgba(0,0,0,.55) 60%,transparent 100%);
            mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 30%,rgba(0,0,0,.55) 60%,transparent 100%)}
  .terrain.on{opacity:1}
  .terrain svg{width:100%;height:100%;display:block}
  .terrain path{fill:none;stroke:#9a9ca6;stroke-opacity:.28;stroke-width:.8;vector-effect:non-scaling-stroke}
  .terrain path.idx{stroke:#d6d7dc;stroke-opacity:.42;stroke-width:1.4}
  .terrain .grat{stroke:#9a9ca6;stroke-opacity:.18;stroke-dasharray:2 5}
  .terrain .mark{stroke:var(--accent);stroke-opacity:.9;stroke-width:1.4}
  /* caption sits outside the faded layer so it stays fully readable */
  .terrain-cap{position:absolute;z-index:1;right:0;top:-2px;font:400 10px var(--mono);letter-spacing:.16em;color:var(--muted);text-transform:uppercase;opacity:0;transition:opacity 1.2s ease}
  .terrain-cap.on{opacity:.85}
  .place{font:400 clamp(40px,7vw,84px)/.95 var(--display);text-transform:uppercase}
  .place .o{color:transparent;-webkit-text-stroke:1.4px var(--ink)}
  .sub{font:400 13px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:12px}
  .temp{display:flex;align-items:flex-start;gap:18px;margin-top:22px}
  .temp .v{font:400 clamp(96px,16vw,190px)/.85 var(--display)}
  .temp .u{font:400 34px var(--display);color:var(--muted);margin-top:8px}
  .cond{font:500 18px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-top:14px;display:flex;align-items:center;gap:12px}
  .cells{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
  .cell{padding:18px 0 18px;border-bottom:1px solid var(--rule)}
  .cell:nth-child(odd){padding-right:18px;border-right:1px solid var(--rule)}
  .cell:nth-child(even){padding-left:18px}
  .cell .v{font:400 30px/1 var(--display);display:flex;align-items:center;gap:10px}

  .panel{margin-top:40px;border-top:1px solid var(--rule);padding-top:18px;position:relative}
  .panel::before{content:"";position:absolute;top:-2px;left:0;width:56px;height:3px;background:var(--accent)}
  .chart{width:100%;height:auto;display:block;margin-top:6px}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:8px}
  .day{background:var(--panel);border:1px solid var(--rule);padding:14px 10px;text-align:center}
  .day .d{font:500 12px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .day svg{margin:12px auto 10px;display:block}
  .day .hi{font:400 24px var(--display)}
  .day .lo{font:400 14px var(--mono);color:var(--muted)}
  .empty{margin-top:64px;color:var(--muted);font:400 14px var(--mono);letter-spacing:.1em;text-transform:uppercase;text-align:center}
  .foot a{color:inherit;text-decoration:none;border-bottom:1px solid var(--rule)}
  .foot a:hover{color:var(--ink)}
  .foot{margin-top:40px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font:400 11px var(--mono);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  .pulse{animation:p 1.2s ease-in-out infinite}
  @keyframes p{50%{opacity:.35}}
  @media (max-width:820px){
    .hero{grid-template-columns:1fr}
    .terrain{width:100%;right:0;top:-40px}
    .terrain-cap{display:none}
    .terrain .mark{display:none}   /* stacked layout: no empty spot for the marker */
    .days{grid-template-columns:repeat(4,1fr)}
    .readout span:nth-child(3){display:none}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
// ---- Weather: Open-Meteo, called straight from the browser (free, no key, CORS-enabled) ----
// Same shape as the workshop backend's /forecast endpoint, so the UI below is unchanged.
const GEOCODING_URL = "https://geocoding-api.open-meteo.com/v1/search";
const FORECAST_URL = "https://api.open-meteo.com/v1/forecast";
const WEATHER_CODES = {
  0: ["Clear sky", "clear"], 1: ["Mainly clear", "clear"], 2: ["Partly cloudy", "cloud"], 3: ["Overcast", "cloud"],
  45: ["Fog", "fog"], 48: ["Freezing fog", "fog"],
  51: ["Light drizzle", "rain"], 53: ["Drizzle", "rain"], 55: ["Heavy drizzle", "rain"],
  56: ["Freezing drizzle", "rain"], 57: ["Heavy freezing drizzle", "rain"],
  61: ["Light rain", "rain"], 63: ["Rain", "rain"], 65: ["Heavy rain", "rain"],
  66: ["Freezing rain", "rain"], 67: ["Heavy freezing rain", "rain"],
  71: ["Light snow", "snow"], 73: ["Snow", "snow"], 75: ["Heavy snow", "snow"], 77: ["Snow grains", "snow"],
  80: ["Light showers", "rain"], 81: ["Showers", "rain"], 82: ["Heavy showers", "rain"],
  85: ["Snow showers", "snow"], 86: ["Heavy snow showers", "snow"],
  95: ["Thunderstorm", "storm"], 96: ["Thunderstorm with hail", "storm"], 99: ["Thunderstorm with heavy hail", "storm"],
};
const describe = code => WEATHER_CODES[code] || ["Unknown", "cloud"];

async function getJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("Weather service unavailable, try again");
  return res.json();
}

async function geocode(city) {
  const geo = await getJSON(`${GEOCODING_URL}?${new URLSearchParams({ name: city, count: 1 })}`);
  const place = geo.results && geo.results[0];
  if (!place) throw new Error(`City '${city}' not found`);
  return place;
}

// ---- Default city: where the viewer is ------------------------------------------
// The browser asks permission; the forecast and terrain use the exact coordinates and
// BigDataCloud's free client-side reverse geocoder supplies the place name.
const REVERSE_URL = "https://api.bigdatacloud.net/data/reverse-geocode-client";

function locate() {
  return new Promise((ok, fail) => {
    if (!navigator.geolocation) return fail(new Error("Geolocation unavailable"));
    navigator.geolocation.getCurrentPosition(p => ok(p.coords), fail, { timeout: 10000, maximumAge: 600000 });
  });
}

async function hereAsPlace() {
  const { latitude, longitude } = await locate();
  const place = { name: "Your location", country: "", admin1: "", latitude, longitude, located: true };
  try {
    const r = await getJSON(`${REVERSE_URL}?${new URLSearchParams({ latitude, longitude, localityLanguage: "en" })}`);
    place.name = r.city || r.locality || place.name;
    place.country = r.countryName || "";
    place.admin1 = r.principalSubdivision || "";
  } catch { /* no name: keep "Your location", the weather still works */ }
  return place;
}

const getForecast = async city => forecastFor(await geocode(city));

async function forecastFor(place) {
  const data = await getJSON(`${FORECAST_URL}?${new URLSearchParams({
    latitude: place.latitude, longitude: place.longitude,
    current: "temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day",
    hourly: "temperature_2m,precipitation_probability",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset",
    timezone: "auto", forecast_days: 7,
  })}`);
  const { current, hourly, daily } = data;
  // Next 24 hours, starting at the current hour (times are local to the city).
  let start = hourly.time.findIndex(t => t >= current.time.slice(0, 13));
  if (start < 0) start = 0;
  const hours = hourly.time.slice(start, start + 24).map((t, i) => ({
    time: t.slice(11, 16), temp_c: hourly.temperature_2m[start + i], rain_pct: hourly.precipitation_probability[start + i],
  }));
  const days = daily.time.map((d, i) => ({
    date: d, condition: describe(daily.weather_code[i])[0], icon: describe(daily.weather_code[i])[1],
    max_c: daily.temperature_2m_max[i], min_c: daily.temperature_2m_min[i],
  }));
  const [condition, icon] = describe(current.weather_code);
  return {
    city: place.name, country: place.country || "", region: place.admin1 || "", located: !!place.located,
    latitude: place.latitude, longitude: place.longitude,
    timezone: data.timezone || "", local_time: current.time, is_day: !!current.is_day,
    current: {
      temperature_c: current.temperature_2m, feels_like_c: current.apparent_temperature,
      humidity_pct: current.relative_humidity_2m, wind_kmh: current.wind_speed_10m,
      wind_dir_deg: current.wind_direction_10m, condition, icon,
    },
    sunrise: daily.sunrise[0].slice(11, 16), sunset: daily.sunset[0].slice(11, 16), hours, days,
  };
}

const PRESETS = ["Paris", "Tokyo", "São Paulo", "Reykjavík", "Nairobi"];

const toUnit = (c, u) => u === "F" ? c * 9 / 5 + 32 : c;
const deg = (c, u) => `${Math.round(toUnit(c, u))}°`;
const weekday = iso => new Date(iso + "T12:00").toLocaleDateString("en-GB", { weekday: "short" });

function Icon({ kind, size = 36 }) {
  const s = { fill: "none", stroke: "currentColor", strokeWidth: 1.6, strokeLinecap: "round", strokeLinejoin: "round" };
  const cloud = <path d="M9 26h16a6 6 0 0 0 0-12 8 8 0 0 0-15.5 2A5 5 0 0 0 9 26z" {...s}/>;
  const shapes = {
    clear: <g {...s}><circle cx="18" cy="18" r="6.5"/>{[...Array(8)].map((_, i) => {
      const a = i * Math.PI / 4; return <line key={i} x1={18 + Math.cos(a) * 10} y1={18 + Math.sin(a) * 10} x2={18 + Math.cos(a) * 14} y2={18 + Math.sin(a) * 14}/>; })}</g>,
    cloud,
    rain: <g>{cloud}<g {...s} stroke="var(--cool)"><line x1="12" y1="29" x2="10.5" y2="33"/><line x1="18" y1="29" x2="16.5" y2="33"/><line x1="24" y1="29" x2="22.5" y2="33"/></g></g>,
    snow: <g>{cloud}<g {...s}><circle cx="12" cy="31" r=".9"/><circle cx="18" cy="32" r=".9"/><circle cx="24" cy="31" r=".9"/></g></g>,
    fog: <g {...s}><line x1="7" y1="13" x2="29" y2="13"/><line x1="5" y1="19" x2="27" y2="19"/><line x1="9" y1="25" x2="31" y2="25"/></g>,
    storm: <g>{cloud}<path d="M19 26l-4 6h5l-3 5" {...s} stroke="var(--accent)"/></g>,
  };
  return <svg width={size} height={size} viewBox="0 0 36 38" style={{ color: "var(--ink)" }}>{shapes[kind] || cloud}</svg>;
}

function WindArrow({ dir }) {
  // Meteorological direction is where the wind comes FROM; the arrow points where it goes.
  return <svg width="22" height="22" viewBox="0 0 22 22" style={{ transform: `rotate(${dir + 180}deg)` }}>
    <path d="M11 3v16M11 3l-5 6M11 3l5 6" fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinecap="round"/>
  </svg>;
}

function HourChart({ hours, unit }) {
  const W = 1100, H = 220, P = { l: 36, r: 12, t: 26, b: 34 };
  const temps = hours.map(h => toUnit(h.temp_c, unit));
  const lo = Math.floor(Math.min(...temps)) - 1, hi = Math.ceil(Math.max(...temps)) + 1;
  const x = i => P.l + i * (W - P.l - P.r) / (hours.length - 1);
  const y = v => P.t + (hi - v) * (H - P.t - P.b) / (hi - lo || 1);
  const line = temps.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${line}L${x(hours.length - 1)},${H - P.b}L${x(0)},${H - P.b}Z`;
  const barW = (W - P.l - P.r) / hours.length * .5;
  return (
    <svg className="chart" viewBox={`0 0 ${W} ${H}`} role="img" aria-label="Temperature for the next 24 hours">
      <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stopColor="#c8102e" stopOpacity=".35"/><stop offset="1" stopColor="#c8102e" stopOpacity="0"/>
      </linearGradient></defs>
      {hours.map((h, i) => h.rain_pct > 0 && (
        <rect key={"r" + i} x={x(i) - barW / 2} width={barW} y={H - P.b - h.rain_pct * .6} height={h.rain_pct * .6} fill="var(--cool)" opacity=".35"/>
      ))}
      <line x1={P.l} x2={W - P.r} y1={H - P.b} y2={H - P.b} stroke="var(--rule)"/>
      <path d={area} fill="url(#g)"/>
      <path d={line} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinejoin="round"/>
      {hours.map((h, i) => i % 3 === 0 && (
        <g key={i}>
          <circle cx={x(i)} cy={y(temps[i])} r="3.5" fill="var(--field)" stroke="var(--accent)" strokeWidth="2"/>
          <text x={x(i)} y={y(temps[i]) - 10} textAnchor="middle" fill="var(--ink)" fontFamily="JetBrains Mono" fontSize="13">{Math.round(temps[i])}°</text>
          <text x={x(i)} y={H - 12} textAnchor="middle" fill="var(--muted)" fontFamily="JetBrains Mono" fontSize="12">{i === 0 ? "NOW" : h.time}</text>
        </g>
      ))}
    </svg>
  );
}

// ---- Terrain: elevation tiles -> contour lines --------------------------------
// AWS Terrain Tiles (terrarium PNG, free, no key): height = R*256 + G + B/256 - 32768 metres
const TILES = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium";
const TZ = 11, VIEW_W = 768, VIEW_H = 640, STEP = 2;   // ~45 km x 38 km around the city at the equator
const FOCUS_Y = 0.34;   // the city sits above the stats grid, in the empty space, not behind the text

const loadImage = src => new Promise((ok, fail) => {
  const img = new Image(); img.crossOrigin = "anonymous";
  img.onload = () => ok(img); img.onerror = fail; img.src = src;
});

function boxBlur(src, w, h, r) {
  const tmp = new Float32Array(src.length), out = new Float32Array(src.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let sum = 0, n = 0;
    for (let k = -r; k <= r; k++) { const xx = x + k; if (xx >= 0 && xx < w) { sum += src[y * w + xx]; n++; } }
    tmp[y * w + x] = sum / n;
  }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let sum = 0, n = 0;
    for (let k = -r; k <= r; k++) { const yy = y + k; if (yy >= 0 && yy < h) { sum += tmp[yy * w + x]; n++; } }
    out[y * w + x] = sum / n;
  }
  return out;
}

async function elevationGrid(lat, lon) {
  const n = 2 ** TZ, s = Math.sin(lat * Math.PI / 180);
  const px = (lon + 180) / 360 * 256 * n;
  const py = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * n;
  const x0 = Math.round(px - VIEW_W / 2), y0 = Math.round(py - VIEW_H * FOCUS_Y);
  const canvas = document.createElement("canvas"); canvas.width = VIEW_W; canvas.height = VIEW_H;
  const g = canvas.getContext("2d", { willReadFrequently: true });
  const jobs = [];
  for (let ty = Math.floor(y0 / 256); ty <= Math.floor((y0 + VIEW_H - 1) / 256); ty++)
    for (let tx = Math.floor(x0 / 256); tx <= Math.floor((x0 + VIEW_W - 1) / 256); tx++) {
      if (ty < 0 || ty >= n) continue;
      const wx = ((tx % n) + n) % n;
      jobs.push(loadImage(`${TILES}/${TZ}/${wx}/${ty}.png`).then(img => g.drawImage(img, tx * 256 - x0, ty * 256 - y0)));
    }
  await Promise.all(jobs);
  const { data } = g.getImageData(0, 0, VIEW_W, VIEW_H);
  const w = VIEW_W / STEP, h = VIEW_H / STEP, grid = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * STEP * VIEW_W + x * STEP) * 4;
    grid[y * w + x] = Math.max(data[i] * 256 + data[i + 1] + data[i + 2] / 256 - 32768, -30);  // flatten the sea floor
  }
  return { grid: boxBlur(boxBlur(grid, w, h, 2), w, h, 1), w, h };
}

function contourLevels(grid) {
  let lo = Infinity, hi = -Infinity;
  for (const v of grid) { if (v < lo) lo = v; if (v > hi) hi = v; }
  const raw = Math.max((hi - lo) / 28, 0.5);                       // aim for ~28 lines, whatever the relief
  const mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= raw);
  const levels = [];
  for (let v = Math.ceil(lo / step) * step; v < hi; v += step) levels.push(+v.toFixed(3));
  return { levels, step, lo, hi };
}

function Terrain({ lat, lon }) {
  const [map, setMap] = React.useState(null);
  React.useEffect(() => {
    let live = true; setMap(null);
    elevationGrid(lat, lon).then(({ grid, w, h }) => {
      const { levels, step, lo, hi } = contourLevels(grid);
      const path = d3.geoPath();
      const paths = d3.contours().size([w, h]).thresholds(levels)(grid).map(c => ({
        d: path(c), idx: Math.abs(c.value / (step * 5) - Math.round(c.value / (step * 5))) < 1e-6,
      }));
      if (live) setMap({ paths, w, h, step, lo, hi, center: grid[Math.round(h * FOCUS_Y) * w + (w >> 1)] });
    }).catch(() => live && setMap(null));      // no terrain is fine: the dashboard still works
    return () => { live = false; };
  }, [lat, lon]);

  const w = map ? map.w : 384, h = map ? map.h : 320, cx = w / 2, cy = h * FOCUS_Y;
  const fmt = v => `${Math.round(v)} m`;
  return (<>
    <div className={"terrain" + (map ? " on" : "")} aria-hidden="true">
      <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMin slice">
        {[1, 2, 3].map(i => <line key={"v" + i} className="grat" x1={w * i / 4} x2={w * i / 4} y1="0" y2={h} vectorEffect="non-scaling-stroke"/>)}
        {[1, 2, 3].map(i => <line key={"h" + i} className="grat" y1={h * i / 4} y2={h * i / 4} x1="0" x2={w} vectorEffect="non-scaling-stroke"/>)}
        {map && map.paths.map((p, i) => <path key={i} d={p.d} className={p.idx ? "idx" : ""}/>)}
        <g className="mark" vectorEffect="non-scaling-stroke">
          <line x1={cx - 7} x2={cx + 7} y1={cy} y2={cy} vectorEffect="non-scaling-stroke"/>
          <line x1={cx} x2={cx} y1={cy - 7} y2={cy + 7} vectorEffect="non-scaling-stroke"/>
          <circle cx={cx} cy={cy} r="12" fill="none" vectorEffect="non-scaling-stroke"/>
        </g>
      </svg>
    </div>
    <div className={"terrain-cap" + (map ? " on" : "")}>
      {map && <>Terrain // {fmt(map.lo)}–{fmt(map.hi)} · contours {map.step} m · here {fmt(map.center)}</>}
    </div>
  </>);
}

function App() {
  const [city, setCity] = React.useState("");
  const [data, setData] = React.useState(null);
  const [error, setError] = React.useState("");
  const [loading, setLoading] = React.useState(false);
  const [unit, setUnit] = React.useState("C");

  // query: a city name typed or clicked, or a place object from hereAsPlace()
  async function load(query) {
    if (typeof query === "string" && !query.trim()) return;
    setLoading(true); setError("");
    try {
      const body = typeof query === "string" ? await getForecast(query.trim()) : await forecastFor(query);
      setData(body); setCity(body.city);
      // shareable link: ?city=Tokyo opens straight on that city
      if (!(body.located && body.city === "Your location")) history.replaceState(null, "", `?city=${encodeURIComponent(body.city)}`);
    } catch (err) {
      setError(err instanceof TypeError ? "Can't reach the weather service. Are you online?" : err.message);
    } finally { setLoading(false); }
  }

  React.useEffect(() => {
    const shared = new URLSearchParams(location.search).get("city");
    if (shared) load(shared);                                   // a ?city= link wins
    else hereAsPlace().then(load, () => load("Paris"));         // else where you are; Paris if declined
  }, []);
  const c = data && data.current;

  return (
    <div className="wrap">
      <div className="readout">
        <span>Ref. GC-2609 // <b>Weather dashboard</b></span>
        <span>{data ? `Local ${data.local_time.slice(11)} · ${data.timezone}` : "Awaiting signal"}</span>
        <span>Outline → Wireframe → Signal</span>
      </div>

      <form onSubmit={e => { e.preventDefault(); load(city); }}>
        <input value={city} onChange={e => setCity(e.target.value)} placeholder="Search a city…" aria-label="City"/>
        <button className="go" disabled={loading}>{loading ? "…" : "Get weather"}</button>
      </form>
      <div className="chips">
        {PRESETS.map(p => <button key={p} className="chip" onClick={() => load(p)}>{p}</button>)}
        <div className="units">
          {["C", "F"].map(u => <button key={u} className={unit === u ? "on" : ""} onClick={() => setUnit(u)}>°{u}</button>)}
        </div>
      </div>

      {error && <div className="error">{error}</div>}
      {!data && !error && <div className="empty pulse">Acquiring weather…</div>}

      {data && (
        <div className={loading ? "pulse" : ""}>
          <section className="hero">
            <Terrain lat={data.latitude} lon={data.longitude}/>
            <div>
              <div className="place">{data.city}<br/><span className="o">{data.country}</span></div>
              <div className="sub">{[data.region, `${data.latitude.toFixed(2)}°, ${data.longitude.toFixed(2)}°`].filter(Boolean).join(" · ")}</div>
              <div className="temp"><span className="v">{Math.round(toUnit(c.temperature_c, unit))}</span><span className="u">°{unit}</span></div>
              <div className="cond"><Icon kind={c.icon} size={30}/>{c.condition}</div>
            </div>
            <div className="cells">
              <div className="cell"><div className="k">Feels like</div><div className="v">{deg(c.feels_like_c, unit)}</div></div>
              <div className="cell"><div className="k">Humidity</div><div className="v">{c.humidity_pct}%</div></div>
              <div className="cell"><div className="k">Wind</div><div className="v"><WindArrow dir={c.wind_dir_deg}/>{Math.round(c.wind_kmh)} km/h</div></div>
              <div className="cell"><div className="k">Today</div><div className="v">{deg(data.days[0].max_c, unit)} / {deg(data.days[0].min_c, unit)}</div></div>
              <div className="cell"><div className="k">Sunrise</div><div className="v">{data.sunrise}</div></div>
              <div className="cell"><div className="k">Sunset</div><div className="v">{data.sunset}</div></div>
            </div>
          </section>

          <section className="panel">
            <div className="k">Next 24 hours · temperature <span style={{ color: "var(--cool)" }}>· rain chance</span></div>
            <HourChart hours={data.hours} unit={unit}/>
          </section>

          <section className="panel">
            <div className="k">7-day outlook</div>
            <div className="days">
              {data.days.map((d, i) => (
                <div className="day" key={d.date} title={d.condition}>
                  <div className="d">{i === 0 ? "Today" : weekday(d.date)}</div>
                  <Icon kind={d.icon}/>
                  <div className="hi">{deg(d.max_c, unit)}</div>
                  <div className="lo">{deg(d.min_c, unit)}</div>
                </div>
              ))}
            </div>
          </section>
        </div>
      )}

      <div className="foot">
        <span>Weather // <a href="https://open-meteo.com/">Open-Meteo</a> (CC BY 4.0) · Terrain // <a href="https://registry.opendata.aws/terrain-tiles/">AWS Terrain Tiles</a></span>
        <span>Built at <a href="https://github.com/Delta-43/guided-coding-workshop">Guided Coding</a> · #GuidedCoding</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
