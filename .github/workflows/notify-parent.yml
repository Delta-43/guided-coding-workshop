name: Notify parent repo of new commits

# Fires whenever main advances, so the "workshops" super-repo can pull its
# submodule pointer forward automatically instead of drifting behind.
on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to Delta-43/workshops
        env:
          TOKEN: ${{ secrets.WORKSHOPS_SYNC_TOKEN }}
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Delta-43/workshops/dispatches \
            -d '{"event_type":"guided-coding-workshop-updated","client_payload":{"sha":"'"${GITHUB_SHA}"'"}}'
